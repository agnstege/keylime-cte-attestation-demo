name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # Rocky 9's system Python
      - name: Byte-compile the broker
        run: python -m py_compile broker/broker.py
      - name: ShellCheck the scripts
        run: shellcheck scripts/*.sh
